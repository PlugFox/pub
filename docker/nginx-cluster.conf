# The acceptance stand's proxy — two replicas, one front door (decision 38).
#
# This is the multi-upstream form of the configuration in docs/ops/reverse-proxy.md, kept
# deliberately close to it: sizes, timeouts and header handling are the same, because a
# stand that proxies differently from the documented recipe measures a deployment nobody
# was told to run. Two differences are the stand's own, and both are called out below.
#
# It terminates no TLS. That is a stand, not a deployment: the acceptance run needs two
# replicas and one balancer, and a certificate would only add a step to the setup.

upstream pub_app {
    # No ip_hash and no sticky cookie, on purpose. Stickiness would hide exactly the
    # defects this stand exists to find — a session that only works on the instance that
    # minted it, a stream that only carries events from the instance it is attached to.
    server app-a:8080 max_fails=0;
    server app-b:8080 max_fails=0;
}

server {
    listen 80;
    server_name _;

    # Stand-only: which replica served this request. The proxy is the one component that
    # cannot be wrong about it, which is why the acceptance run reads this instead of the
    # application growing an instance identifier on its unauthenticated health endpoint.
    add_header X-Upstream $upstream_addr always;

    # App UI + app API. The app-side body cap is 2 MiB (http.max_body_bytes).
    location / {
        proxy_pass http://pub_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # $proxy_add_x_forwarded_for APPENDS the peer address, so the rightmost entry is
        # what this proxy observed — the shape S-24.b requires, and the reason both
        # replicas run with server.trust_proxy_headers = true.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 2m;
    }

    # SSE: unbuffered, and a read timeout above the 80 s keep-alive cadence. pubd sends no
    # X-Accel-Buffering header, so without this the stream sits in nginx's buffer and the
    # cross-replica delivery claim would fail for a reason that has nothing to do with the
    # broker it is testing.
    location = /api/v1/events {
        proxy_pass http://pub_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }

    # pub protocol (org bases /o/{org}/pub and the public root /pub): uploads up to
    # registry.max_archive_bytes + multipart overhead traverse the app tier, so the
    # timeouts must exceed http.upload_timeout_secs (300 s).
    location ~ ^/(o/[^/]+/)?pub/ {
        proxy_pass http://pub_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 101m;
        proxy_request_buffering off;
        proxy_read_timeout  310s;
        proxy_send_timeout  310s;
    }
}
