# Security CI — secret and supply-chain hygiene (S-15: gitleaks rule for the pub_ token
# format, decision 13; S-30: cargo audit with documented ignores, license/source policy
# via cargo-deny, unused-dependency check via cargo-machete, frontend lockfile audit
# via bun audit).
# Deliberately NO path filters, on any trigger: a secret can land in any file, the
# weekly cron must never be skippable-green (new advisories have no diff), and the
# non-gitleaks legs are cheap. Everything this workflow executes is pinned — actions
# by commit SHA, downloaded binaries by sha256 — because a supply-chain gate built
# from floating tags would undermine its own point.
name: security-ci

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    # Weekly (Mon 05:30 UTC): RustSec and GitHub-advisory findings surface on a
    # quiet master without waiting for the next push. The trivy image scan has its
    # own weekly cron in docker-ci.yml, same slot.
    - cron: "30 5 * * 1"
  workflow_dispatch:

# One run per ref per trigger; superseded runs are cancelled. The event name is part
# of the group so a push run can never cancel the scheduled leg (or vice versa).
concurrency:
  group: security-ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

# Minimal token surface: checkout only.
permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks (full history)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # The scan covers every commit ever pushed, not just the checkout.
          fetch-depth: 0
      # Pinned binary rather than gitleaks/gitleaks-action: the action requires an
      # org license key, and the binary is the same scanner without the wrapper.
      - name: Install gitleaks (checksum-verified)
        env:
          VERSION: 8.30.1
          SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -euo pipefail
          curl -fsSL -o "$RUNNER_TEMP/gitleaks.tar.gz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz"
          echo "$SHA256  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
      # .gitleaks.toml at the repo root is auto-discovered: default ruleset plus the
      # pub-registry-token rule (S-15). --redact keeps any hit out of the CI log.
      - name: Scan the full git history
        run: '"$RUNNER_TEMP/gitleaks" git --no-banner --redact'

  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install actionlint (checksum-verified)
        env:
          VERSION: 1.7.12
          SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          set -euo pipefail
          curl -fsSL -o "$RUNNER_TEMP/actionlint.tar.gz" \
            "https://github.com/rhysd/actionlint/releases/download/v${VERSION}/actionlint_${VERSION}_linux_amd64.tar.gz"
          echo "$SHA256  $RUNNER_TEMP/actionlint.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
      - name: Lint .github/workflows
        run: '"$RUNNER_TEMP/actionlint" -color'

  cargo-supply-chain:
    name: cargo audit / deny / machete
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # cargo-deny drives `cargo metadata`, so a toolchain is needed even though
      # nothing compiles. SHA of the `stable` branch; the input picks the channel.
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch, 2026-08
        with:
          toolchain: stable
      # Prebuilt, signature-verified binaries — no `cargo install` compile on every run.
      # Tool versions pinned to match the local toolchain (justfile `audit` recipe).
      - uses: taiki-e/install-action@91ddec75689c4c78665b598d188dc821c5a43e5c # v2.85.9
        with:
          tool: cargo-audit@0.22.1,cargo-deny@0.19.4,cargo-machete@0.9.2
      # .cargo/audit.toml carries the justified ignores (S-30) — an unfixed advisory
      # fails this step until it is ignored with a written reason or patched.
      - name: cargo audit
        run: cargo audit
      # deny.toml: license allowlist, duplicate-version warnings, crates.io-only
      # sources, advisory policy. --locked: the verdict must cover the committed
      # Cargo.lock, not a fresh resolution.
      - name: cargo deny check
        run: cargo deny --locked check
      # Unused dependencies are supply-chain surface with zero benefit.
      - name: cargo machete
        run: cargo machete

  # Frontend leg of S-30: audit the committed bun.lock against the GitHub advisory
  # database. `bun audit` (built into Bun since 1.2.15) exits non-zero when any
  # installed package matches an advisory, so a new advisory fails this job until the
  # dependency is updated — the same posture cargo audit gives the server side.
  bun-audit:
    name: bun audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          # Same Bun as the local toolchain — keep in sync with .mise.toml.
          bun-version: 1.3.14
      # --frozen-lockfile: audit exactly the committed bun.lock (S-30), never a
      # fresh resolution.
      - run: bun install --frozen-lockfile
      - run: bun audit
