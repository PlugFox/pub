# Web CI — check / build / test for the Bun workspace in web/.
name: web-ci

on:
  push:
    branches: [master]
    paths:
      - "web/**"
      - ".github/workflows/web-ci.yml"
  pull_request:
    branches: [master]
    paths:
      - "web/**"
      - ".github/workflows/web-ci.yml"
  workflow_dispatch:

# One run per ref; superseded runs are cancelled.
concurrency:
  group: web-ci-${{ github.ref }}
  cancel-in-progress: true

# Minimal token surface: checkout only.
permissions:
  contents: read

defaults:
  run:
    working-directory: web

jobs:
  check:
    name: bun run check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      # --frozen-lockfile: CI must install exactly the committed bun.lock (S-30).
      - run: bun install --frozen-lockfile
      - run: bun run check

  build:
    name: bun run build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      # --frozen-lockfile: CI must install exactly the committed bun.lock (S-30).
      - run: bun install --frozen-lockfile
      - run: bun run build

  test:
    name: bun test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      # --frozen-lockfile: CI must install exactly the committed bun.lock (S-30).
      - run: bun install --frozen-lockfile
      - run: bun test
