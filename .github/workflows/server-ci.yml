# Server CI — fmt / clippy / test for the Rust workspace in server/.
# The production image is docker-ci.yml's concern (build-only) and release.yml's
# (tagged releases) — decision 18.
name: server-ci

on:
  push:
    branches: [master]
    paths:
      - "server/**"
      - ".github/workflows/server-ci.yml"
  pull_request:
    branches: [master]
    paths:
      - "server/**"
      - ".github/workflows/server-ci.yml"
  workflow_dispatch:

# One run per ref; superseded runs are cancelled.
concurrency:
  group: server-ci-${{ github.ref }}
  cancel-in-progress: true

# Minimal token surface: checkout only.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # docs/rules/rust.md: CI builds with SQLX_OFFLINE=true (committed .sqlx/ cache).
  # Harmless before sqlx lands; load-bearing once it does.
  SQLX_OFFLINE: "true"

defaults:
  run:
    working-directory: server

jobs:
  fmt:
    name: cargo fmt
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # SHA of the `stable` branch; the toolchain input picks the channel.
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch, 2026-08
        with:
          toolchain: stable
          components: rustfmt
      # No rust-cache here: fmt compiles nothing.
      - run: cargo fmt --check

  clippy:
    name: cargo clippy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch, 2026-08
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: server -> target
      # --locked: CI must build exactly the committed Cargo.lock (S-30).
      - run: cargo clippy --all-targets --locked -- -D warnings

  test:
    name: cargo test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Postgres leg of the backend matrix: the shared repository contract suite
    # (crates/db-tests/tests/postgres.rs) is gated at runtime by PUB_TEST_POSTGRES_URL —
    # exported below, so it runs here and skips cleanly on machines without the variable.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: pub
          POSTGRES_PASSWORD: pub
          POSTGRES_DB: pub
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U pub -d pub"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PUB_TEST_POSTGRES_URL: postgres://pub:pub@127.0.0.1:5432/pub
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch, 2026-08
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: server -> target
      # --locked: CI must build exactly the committed Cargo.lock (S-30).
      - run: cargo test --workspace --locked
