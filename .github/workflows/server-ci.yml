# Server CI — fmt / clippy / test for the Rust workspace in server/.
# The production image is docker-ci.yml's concern (build-only) and release.yml's
# (tagged releases) — decision 18.
name: server-ci

on:
  push:
    branches: [master]
    paths:
      - "server/**"
      - ".github/workflows/server-ci.yml"
  pull_request:
    branches: [master]
    paths:
      - "server/**"
      - ".github/workflows/server-ci.yml"
  workflow_dispatch:

# One run per ref; superseded runs are cancelled.
concurrency:
  group: server-ci-${{ github.ref }}
  cancel-in-progress: true

# Minimal token surface: checkout only.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # docs/rules/rust.md: CI builds with SQLX_OFFLINE=true (committed .sqlx/ cache).
  # Harmless before sqlx lands; load-bearing once it does.
  SQLX_OFFLINE: "true"

defaults:
  run:
    working-directory: server

jobs:
  fmt:
    name: cargo fmt
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # SHA of the `stable` branch; the toolchain input picks the channel.
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch, 2026-08
        with:
          toolchain: stable
          components: rustfmt
      # No rust-cache here: fmt compiles nothing.
      - run: cargo fmt --check

  clippy:
    name: cargo clippy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch, 2026-08
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: server -> target
      # --locked: CI must build exactly the committed Cargo.lock (S-30).
      - run: cargo clippy --all-targets --locked -- -D warnings

  test:
    name: cargo test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The backend matrix (decision 35). Each optional backend is addressed by one PUB_TEST_*
    # variable, exported below beside the service that serves it; **no opt-out is set here**,
    # so a service that fails to start — or an env line deleted from this file — fails the
    # build instead of skipping green. That is the whole of D16's exit.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: pub
          POSTGRES_PASSWORD: pub
          POSTGRES_DB: pub
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U pub -d pub"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      # Valkey, matching docker/docker-compose.yml's redis profile: the Kv contract suite's
      # Redis leg is the first automated execution RedisKv has ever had.
      redis:
        image: valkey/valkey:8-alpine
        ports:
          - "6379:6379"
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      # MinIO is deliberately NOT a service container: the image needs `server /data` as its
      # command and the `services:` block cannot set one, so it is started as a step below.
    env:
      PUB_TEST_POSTGRES_URL: postgres://pub:pub@127.0.0.1:5432/pub
      PUB_TEST_REDIS_URL: redis://127.0.0.1:6379
      PUB_TEST_S3_ENDPOINT: http://127.0.0.1:9000
      PUB_TEST_S3_ACCESS_KEY: pub-minio
      PUB_TEST_S3_SECRET_KEY: pub_dev_password
      PUB_TEST_S3_BUCKET: pub
      # The two-replica acceptance stand is not a CI leg: it builds the production image and
      # boots five containers, and a run that flakes on a cold runner teaches people to ignore
      # it (decision 38). The opt-out is explicit rather than implied, which is the whole rule —
      # deleting this line turns the acceptance suite red instead of quietly skipping it, and
      # that is how it should read when somebody decides the leg is worth adding.
      PUB_TEST_NO_CLUSTER: 1
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch, 2026-08
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: server -> target
      # MinIO, and then the bucket. The bucket is not the server: an S3 leg that fails because
      # nobody created a bucket is a different failure from one whose endpoint is down, and the
      # suite says which — creating it here is what keeps the second message out of CI.
      - name: Start MinIO and create the test bucket
        run: |
          docker run -d --name pub-minio --network host \
            -e "MINIO_ROOT_USER=$PUB_TEST_S3_ACCESS_KEY" \
            -e "MINIO_ROOT_PASSWORD=$PUB_TEST_S3_SECRET_KEY" \
            minio/minio:latest server /data
          for _ in $(seq 1 30); do
            curl -sf "$PUB_TEST_S3_ENDPOINT/minio/health/live" && break
            sleep 2
          done
          curl -sf "$PUB_TEST_S3_ENDPOINT/minio/health/live"
          docker run --rm --network host --entrypoint sh \
            -e "ENDPOINT=$PUB_TEST_S3_ENDPOINT" \
            -e "ACCESS_KEY=$PUB_TEST_S3_ACCESS_KEY" \
            -e "SECRET_KEY=$PUB_TEST_S3_SECRET_KEY" \
            -e "BUCKET=$PUB_TEST_S3_BUCKET" \
            minio/mc:latest -ceu '
              mc alias set pub "$ENDPOINT" "$ACCESS_KEY" "$SECRET_KEY"
              mc mb --ignore-existing "pub/$BUCKET"
            '
      # --locked: CI must build exactly the committed Cargo.lock (S-30).
      - run: cargo test --workspace --locked
