# Namespace: common — shared chrome (layout, navigation, theme, language).
#
# Shape per key:
#   <camelCaseKey>:
#     en:   source-of-truth English text (string, or CLDR plural-form map)
#     desc: mandatory context for translators and LLMs — what/where/constraints
#     <locale>: optional translation (ru fr it de es pt ja ko zh-Hans)
#
# `bun run i18n:gen` regenerates src/generated/ and apps/site/public/locales/;
# locales missing a translation fall back to English and get a __todo__ marker.

siteTitle:
  en: Pub
  ru: Pub
  desc: Product name shown in the header, hero, and browser title. Usually kept untranslated.

tagline:
  en: Self-hosted package registry for Dart and Flutter
  ru: Собственный реестр пакетов для Dart и Flutter
  desc: One-line product description under the title on the landing page.

navHome:
  en: Home
  ru: Главная
  desc: Navigation link leading back to the landing page.

navApp:
  en: Open app
  ru: Открыть приложение
  desc: Button/link on the landing page that opens the web application under /app.

themePicker:
  en: Choose theme
  ru: Выбрать тему
  desc: Accessible label and tooltip of the header button that opens the theme menu (system / light / dark / AMOLED).

themeSystem:
  en: System
  ru: Системная
  desc: Theme menu option that follows the operating system's light/dark preference.

themeLight:
  en: Light
  ru: Светлая
  desc: Theme menu option selecting the light palette.

themeDark:
  en: Dark
  ru: Тёмная
  desc: Theme menu option selecting the dark palette.

themeAmoled:
  en: AMOLED
  ru: AMOLED
  desc: Theme menu option selecting the true-black dark palette for OLED screens. "AMOLED" is a display-technology name — usually kept untranslated.

language:
  en: Language
  ru: Язык
  desc: Label of the interface language picker.

close:
  en: Close
  ru: Закрыть
  desc: Accessible label of dismiss buttons (dialog close, toast dismiss).

copy:
  en: Copy
  ru: Копировать
  desc: Label of the CopyButton in its idle state; copies the adjacent value to the clipboard.

copied:
  en: Copied
  ru: Скопировано
  desc: Label the CopyButton shows for two seconds after a successful clipboard write.

loading:
  en: Loading…
  ru: Загрузка…
  desc: Accessible name of the Spinner while an action of unknown duration is running.

notFound:
  en: Page not found
  ru: Страница не найдена
  desc: Heading of the 404 error page.

appDashboard:
  en: Dashboard
  ru: Обзор
  desc: Title of the app's placeholder dashboard route (/app).

appAbout:
  en: About
  ru: О приложении
  desc: Title of the app's placeholder about route (/app/about).

packagesCount:
  en:
    one: "{count} package"
    other: "{count} packages"
  ru:
    one: "{count} пакет"
    few: "{count} пакета"
    many: "{count} пакетов"
    other: "{count} пакета"
  desc: How many packages a listing contains. `{count}` is the number, already formatted.

offlineTitle:
  en: You are offline
  ru: Нет подключения
  desc: Heading of the offline fallback page the service worker serves when a navigation fails and there is no network.

offlineBody:
  en: This page needs a connection, and there is none right now. Pages you have already opened are still available, and the app keeps working with whatever it has cached.
  ru: Этой странице нужно подключение, а его сейчас нет. Уже открытые страницы по-прежнему доступны, а приложение продолжает работать с тем, что успело сохранить.
  desc: Body paragraph of the offline fallback page; explains what still works rather than only what failed.

offlineRetry:
  en: Try again
  ru: Повторить
  desc: Button on the offline page that reloads the document the reader was trying to reach.

securityPageTitle:
  en: Security
  ru: Безопасность
  desc: Title of the vulnerability-disclosure page linked from /.well-known/security.txt.

securityPageIntro:
  en: We want to hear about security problems in this registry, and we would rather hear about them early than read about them later.
  ru: Мы хотим узнавать о проблемах безопасности этого реестра и предпочитаем услышать о них раньше, чем прочитать позже.
  desc: Opening paragraph of the disclosure page.

securityPageContactTitle:
  en: How to report
  ru: Как сообщить
  desc: Heading of the reporting-instructions section on the disclosure page.

securityPageContactBody:
  en: The address to write to is published at /.well-known/security.txt on this instance. Include what you did, what happened, and what you expected — a reproduction is worth more than a severity rating.
  ru: Адрес для письма опубликован по пути /.well-known/security.txt на этом инстансе. Опишите, что вы сделали, что произошло и чего вы ожидали — воспроизведение ценнее оценки серьёзности.
  desc: Body of the reporting-instructions section; points at the RFC 9116 file rather than repeating an address that is per-instance configuration.

securityPageScopeTitle:
  en: What we ask
  ru: О чём мы просим
  desc: Heading of the ground-rules section on the disclosure page.

securityPageScopeBody:
  en: Please do not run automated scans against other people's data, do not access accounts that are not yours, and give the operator a chance to fix the problem before publishing it.
  ru: Пожалуйста, не запускайте автоматические сканы по чужим данным, не заходите в чужие аккаунты и дайте оператору возможность исправить проблему до публикации.
  desc: Body of the ground-rules section.

securityPageOperatorTitle:
  en: For operators
  ru: Операторам
  desc: Heading of the section telling instance operators how to publish their own contact.

securityPageOperatorBody:
  en: "This instance publishes a security.txt only when a contact is configured. Set disclosure.contact (a mailto:, https: or tel: URI) and, optionally, disclosure.policy_url pointing back at this page."
  ru: "Этот инстанс публикует security.txt только при заданном контакте. Укажите disclosure.contact (URI вида mailto:, https: или tel:) и при желании disclosure.policy_url со ссылкой на эту страницу."
  desc: Body of the operator section; names the two configuration keys verbatim.
