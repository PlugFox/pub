[package]
name = "pub-registry"
description = "Domain services: publish pipeline, resolution policy, proxy ingest, retraction."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
ammonia = { workspace = true }
bytes = { workspace = true }
chrono = { workspace = true }
comrak = { workspace = true }
flate2 = { workspace = true }
pub-core = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
tar = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
yaml-rust2 = { workspace = true }

[dev-dependencies]
# The publish pipeline is transactional by contract; its tests run against a real migrated
# SQLite database rather than a hand-written repository double.
async-trait = { workspace = true }
flate2 = { workspace = true }
futures = { workspace = true }
pub-config = { workspace = true }
pub-db-sqlite = { workspace = true }
pub-jobs = { workspace = true }
tar = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
