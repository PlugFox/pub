[package]
name = "pub-api"
description = "Axum routers, DTOs, OpenAPI (utoipa), embedded static assets, tower layers."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# "multipart": publish step 2 is a multipart/form-data sink (docs/protocol.md endpoint 3);
# axum does not enable it by default.
axum = { workspace = true, features = ["multipart"] }
# CSP inline-source hashes (S-11): every embedded HTML document's inline <script>/<style> is
# sha256+base64'd at startup so the document policy needs no 'unsafe-inline'.
base64 = { workspace = true }
bytes = { workspace = true }
chrono = { workspace = true }
mime_guess = { workspace = true }
pub-admin = { workspace = true }
pub-auth = { workspace = true }
pub-config = { workspace = true }
pub-core = { workspace = true }
pub-events = { workspace = true }
pub-registry = { workspace = true }
rust-embed = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# CSP inline-source hashes (S-11) — see base64 above.
metrics = { workspace = true }
sha2 = { workspace = true }
# The SSE writer task: broadcast receive, interval heartbeat, and the outbound channel.
tokio = { workspace = true }
tokio-stream = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }
tracing = { workspace = true }
# Origin comparison for the S-12 cross-site guard — parsing beats string prefixes here
# (default ports, case, `null`, look-alike suffixes).
url = { workspace = true }
utoipa = { workspace = true }
utoipa-axum = { workspace = true }

[dev-dependencies]
async-trait = { workspace = true }
# The metrics suite asserts against the *rendered* exposition: a `route` label that degrades to
# a constant and a histogram that renders as a summary are both invisible at the call site.
metrics-exporter-prometheus = { workspace = true }
pub-telemetry = { workspace = true }
# The admin suite drives the real reindex worker through the manual-run registry.
pub-admin = { workspace = true }
# The conformance suite publishes real `.tar.gz` packages through the HTTP surface — a
# hand-rolled fixture would not exercise the ingest path the CLI actually drives.
flate2 = { workspace = true }
# The scripted upstream in the proxy suite hands back a streamed archive body.
futures = { workspace = true }
tar = { workspace = true }
tempfile = { workspace = true }
# The adversarial suite forges tokens the way an attacker would: raw Ed25519 key material
# reused as an HMAC secret (algorithm confusion).
ed25519-dalek = { workspace = true }
hmac = { workspace = true }
http-body-util = { workspace = true }
pub-blob = { workspace = true }
pub-db-sqlite = { workspace = true }
pub-events = { workspace = true }
pub-jobs = { workspace = true }
pub-kv = { workspace = true }
pub-mail = { workspace = true }
# The mock OIDC issuer signs real RS256 id_tokens with a throwaway RSA key (S-01 tests).
rand = { workspace = true }
rsa = { workspace = true }
# test-util enables tokio::time::pause/auto-advance so the deadline unit tests never sleep.
tokio = { workspace = true, features = ["test-util"] }
tower = { workspace = true, features = ["util"] }
