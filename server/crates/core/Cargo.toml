[package]
name = "pub-core"
description = "Domain types, errors, and backend trait contracts for the Pub registry."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

# NOTE: zero infrastructure dependencies (no sqlx / object_store / redis / axum) — docs/rules/rust.md.
[dependencies]
# arc-swap: the runtime-settings snapshot (settings.rs). Pure-Rust leaf crate, not infrastructure.
arc-swap = { workspace = true }
async-trait = { workspace = true }
# base64: opaque keyset cursors (page.rs). A pure-Rust leaf crate — not infrastructure.
base64 = { workspace = true }
bytes = { workspace = true }
chrono = { workspace = true }
futures = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
url = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
# Async trait defaults (EventSink) need a runtime to be exercised in unit tests.
tokio = { workspace = true }
