[package]
name = "pub-config"
description = "Layered boot configuration: defaults -> TOML file -> PUB_ env -> CLI flags."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
base64 = { workspace = true }
clap = { workspace = true }
config = { workspace = true }
pub-core = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }
url = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
# The configuration-reference generator (tests/reference.rs) serializes `Settings::default()`
# to TOML — the same shape the defaults layer of `load_from` is built from — to cross-check
# the documented keys and default values against the code.
toml = { workspace = true }
