[package]
name = "pub-blob"
description = "BlobStore implementations over object_store: fs, in-memory, S3-compatible."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
async-trait = { workspace = true }
bytes = { workspace = true }
futures = { workspace = true }
# http: the method a presigned URL is signed for — object_store's Signer takes `http::Method`.
http = { workspace = true }
metrics = { workspace = true }
object_store = { workspace = true }
pub-config = { workspace = true }
pub-core = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
pub-test-support = { workspace = true }
# The S3 leg of the BlobStore contract suite (decision 35) *dials* the presigned URL: whether
# S3 refuses a method the signature does not cover is S3's behaviour, and no offline assertion
# can reach it.
reqwest = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true }
url = { workspace = true }
