anyhow = { workspace = true }
axum = { workspace = true }
base64 = { workspace = true }
chrono = { workspace = true }
clap = { workspace = true }
futures = { workspace = true }
pub-admin = { workspace = true }
pub-api = { workspace = true }
pub-auth = { workspace = true }
pub-blob = { workspace = true }
pub-mail = { workspace = true }
pub-config = { workspace = true }
pub-core = { workspace = true }
pub-db-postgres = { workspace = true }
pub-db-sqlite = { workspace = true }
pub-events = { workspace = true }
pub-jobs = { workspace = true }
pub-kv = { workspace = true }
pub-registry = { workspace = true }
pub-telemetry = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
# `generate-secrets` tests feed the rendered fragments back through the real config
# loader (env map / TOML file), proving the output boots production validation (S-25).
config = { workspace = true }
tempfile = { workspace = true }
