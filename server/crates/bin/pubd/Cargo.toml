[package]
name = "pubd"
description = "Pub registry server binary: config -> telemetry -> backends -> serve."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "pubd"
path = "src/main.rs"

[dependencies]
