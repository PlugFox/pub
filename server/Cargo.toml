[workspace]
resolver = "3"
members = [
    "crates/core",
    "crates/config",
    "crates/db-sqlite",
    "crates/db-postgres",
    "crates/db-tests",
    "crates/test-support",
    "crates/blob",
    "crates/kv",
    "crates/telemetry",
    "crates/registry",
    "crates/auth",
    "crates/mail",
    "crates/jobs",
    "crates/events",
    "crates/admin",
    "crates/api",
    "crates/bin/pubd",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[workspace.dependencies]
# --- internal crates ---
pub-core = { path = "crates/core" }
pub-config = { path = "crates/config" }
pub-db-sqlite = { path = "crates/db-sqlite" }
pub-db-postgres = { path = "crates/db-postgres" }
pub-db-tests = { path = "crates/db-tests" }
pub-test-support = { path = "crates/test-support" }
pub-blob = { path = "crates/blob" }
pub-kv = { path = "crates/kv" }
pub-telemetry = { path = "crates/telemetry" }
pub-registry = { path = "crates/registry" }
pub-auth = { path = "crates/auth" }
pub-mail = { path = "crates/mail" }
pub-jobs = { path = "crates/jobs" }
pub-api = { path = "crates/api" }
pub-events = { path = "crates/events" }
pub-admin = { path = "crates/admin" }

# --- async runtime & streams ---
tokio = { version = "1.53.1", features = ["full"] }
tokio-stream = { version = "0.1.19", features = ["sync"] }
futures = "0.3.33"
async-trait = "0.1.91"
bytes = "1.12.1"

# --- http / web ---
axum = "0.8.9"
tower = "0.5.3"
# "compression-gzip": the pub version listing carries a full pubspec per version and the client
# refuses to disk-cache responses past ~1 MB (docs/protocol.md sharp edge 7), so the JSON routes
# are gzipped; archive routes deliberately are not.
# "cors": S-12 — CORS locked to the instance origin by explicit config instead of by omission;
# timeouts and load shedding are hand-rolled `from_fn` middlewares (path-aware, family-shaped
# error bodies), so the "timeout"/"limit" features stay off.
tower-http = { version = "0.7.0", features = ["trace", "request-id", "set-header", "compression-gzip", "cors"] }
http = "1.5.0"
http-body-util = "0.1.4"
utoipa = { version = "5.5.0", features = ["axum_extras", "uuid", "chrono"] }
utoipa-axum = "0.2.0"
rust-embed = "8.12.0"
mime_guess = "2.0.5"

# --- data backends ---
# default-features = false: no TLS backend and no query macros needed in the skeleton (leaner build);
# member crates add "sqlite" / "postgres" on top.
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "migrate", "macros"] }
object_store = { version = "0.14.1", features = ["aws"] }
moka = { version = "0.12.15", features = ["future"] }
deadpool-redis = { version = "0.23.0", features = ["rt_tokio_1"] }

# --- crypto & auth ---
# Default features only: "fast" keeps the precomputed tables, "zeroize" wipes key material
# on drop — exactly the set needed for seed-based signing/verification (the bundled RNG
# integration "rand_core" and batch verification stay off).
ed25519-dalek = { version = "3.0.0" }
hmac = "0.13.0"
sha1 = "0.11.0"
sha2 = "0.11.0"
subtle = "2.6.1"
crc32fast = "1.5.0"
base64 = "0.23.1"
getrandom = "0.4.3"
# TOTP-seed sealing with the env KEK (S-05); default features (aes, alloc, getrandom) are all used.
aes-gcm = "0.11.0"
# Recovery-code hashes (S-05: argon2id).
argon2 = "0.5.3"
# RS256 id_token verification (S-01). The "sha2" feature re-exports sha2 with OID support for
# the PKCS#1 v1.5 digest-info encoding; only public-key verification is used at runtime
# (the RUSTSEC-2023-0071 Marvin timing channel concerns private-key operations).
rsa = { version = "0.9.10", features = ["sha2"] }
# ES256 id_token verification (S-01). default-features = false: no pem/pkcs8 parsing — keys
# arrive as raw JWK coordinates.
p256 = { version = "0.14.0", default-features = false, features = ["ecdsa", "std"] }
# OIDC discovery / JWKS / token exchange (S-01). default-features = false: rustls instead of
# native-tls (no OpenSSL linkage), json bodies only; "form" for the OIDC token exchange POST
# (a separate opt-in feature since 0.13).
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls", "form"] }

# --- registry ingest & rendering ---
# default-features = false: the pure-Rust miniz_oxide backend only — no zlib C linkage
# (the archive validator streams untrusted input, so the fewer C decoders the better).
flate2 = { version = "1.1.9", default-features = false, features = ["rust_backend"] }
# default-features = false: no xattr/pax-extension filesystem features — archives are
# inspected in memory and never extracted to disk (S-20).
tar = { version = "0.4.46", default-features = false }
# YAML for pubspec.yaml. yaml-rust2 (not serde_yaml or its forks) because it is pure safe
# Rust and does not expand aliases, which makes YAML "billion laughs" bombs structurally
# impossible on untrusted uploads — see crates/registry/src/pubspec.rs.
yaml-rust2 = "0.11.0"
# README/CHANGELOG rendering (S-11). default-features = false on comrak drops the CLI/syntect
# feature set; only the library renderer is used.
comrak = { version = "0.54.0", default-features = false }
ammonia = "4.1.4"

# --- mail ---
# default-features = false: rustls instead of native-tls (no OpenSSL linkage) and the async
# tokio transport only — the blocking transport is never used.
lettre = { version = "0.11.23", default-features = false, features = [
    "builder",
    "hostname",
    "smtp-transport",
    "pool",
    "tokio1",
    "tokio1-rustls-tls",
] }
askama = "0.16.0"

# --- config & cli ---
# default-features = false: only TOML config files are supported (decision 09); drops yaml/json5/ron parsers.
config = { version = "0.15.25", default-features = false, features = ["toml"] }
clap = { version = "4.6.6", features = ["derive", "env"] }

# --- serde & core types ---
# Lock-free snapshot swap behind the runtime-settings cache (decision 09). A pure-Rust leaf
# data structure — no infrastructure, which is why it is allowed inside `core`.
arc-swap = "1.9.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
# default-features = false: drops wasmbind/js-sys and the deprecated oldtime API; only the
# std clock and serde impls are needed (timestamps are UTC everywhere — docs/rules/rust.md).
chrono = { version = "0.4.45", default-features = false, features = ["std", "clock", "serde"] }
uuid = { version = "1.24.0", features = ["v7", "serde"] }
url = { version = "2.5.8", features = ["serde"] }
thiserror = "2.0.19"

# --- telemetry ---
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
metrics = "0.24.6"
# default-features = false: recorder + render handle only, no bundled HTTP listener —
# /metrics stays config-gated and wired through the api crate later (decision 23).
metrics-exporter-prometheus = { version = "0.18.3", default-features = false }

# --- bin / test utilities ---
anyhow = "1.0.104"
tempfile = "3.27.0"
# Test-only: the generated configuration reference serializes `Settings::default()` to TOML to
# cross-check the parsed struct fields against the real defaults (crates/config/tests/reference.rs).
# Version matches the copy the `config` crate already pulls in, so no second toml in the tree.
toml = "1.1.4"
# Test-only: RSA keygen for the mock OIDC issuer needs a rand_core 0.6 RNG (rsa 0.9 API).
rand = "0.8.7"

# Debug builds of the big-integer and password-hash kernels are unusably slow (RSA keygen and
# argon2id dominate test wall time); optimizing just these leaf crates keeps `cargo test` fast
# without touching our own crates' debuggability.
[profile.dev.package.num-bigint-dig]
opt-level = 3

[profile.dev.package.rsa]
opt-level = 3

[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3
